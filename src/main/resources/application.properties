spring.application.name=cart-service

spring.datasource.url=jdbc:postgresql://localhost:5432/github-proxy
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=username
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.change-log=classpath:liquibase/db.changelog-master.yaml

spring.cloud.openfeign.client.config.productClient.url=http://localhost:8082